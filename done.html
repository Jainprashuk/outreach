<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outreach — Done!</title>
<script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('outreach-theme')||'light');}catch(e){}})();</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon"><i class="ti ti-send"></i></div>
      <span class="sidebar-logo-text">Outreach</span>
    </div>
    <a href="index.html" class="nav-item"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
    <a href="contacts.html" class="nav-item"><i class="ti ti-users"></i> Contacts</a>
    <a href="templates.html" class="nav-item"><i class="ti ti-file-text"></i> Templates</a>
    <a href="analytics.html" class="nav-item"><i class="ti ti-chart-histogram"></i> Analytics</a>
    <div class="nav-section-label">Account</div>
    <a href="settings.html" class="nav-item"><i class="ti ti-settings"></i> Settings</a>
    <div class="sidebar-bottom">
      <button class="theme-toggle" data-theme-toggle type="button">
        <span class="tt-icon"><i class="ti ti-sun"></i><i class="ti ti-moon"></i>Appearance</span>
        <i class="ti ti-chevron-right" style="font-size:12px"></i>      </button>
      <button class="theme-toggle" type="button" style="margin-top:8px" onclick="document.cookie='outreach_ui=react;path=/;max-age=31536000';window.location.href='/app/'" title="Try the new React interface">
        <span class="tt-icon"><i class="ti ti-sparkles"></i>New UI</span>
        <i class="ti ti-chevron-right" style="font-size:12px"></i></button>
      <a href="/logout" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);text-decoration:none;padding:6px 0;margin-top:4px" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text2)'"><i class="ti ti-logout" style="font-size:14px"></i>Sign out</a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" data-mobile-menu-toggle type="button" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <h1>All done!</h1>
      </div>
      <a href="index.html" class="btn btn-sm"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
    </div>

    <div class="success-screen">
      <div class="success-icon"><i class="ti ti-circle-check"></i></div>
      <div class="success-title" id="success-title">Emails sent!</div>
      <div class="success-sub" id="success-sub">Your outreach batch has been delivered.</div>

      <div class="stat-grid" style="max-width:480px;margin:0 auto 28px" id="result-stats"></div>

      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" id="retry-btn" style="display:none" onclick="retryFailed()"><i class="ti ti-refresh"></i> Retry failed emails</button>
        <a href="step1.html" class="btn"><i class="ti ti-plus"></i> Add more contacts</a>
        <a href="step2.html" class="btn" id="review-pending-btn" style="display:none"><i class="ti ti-clock"></i> Review pending</a>
        <a href="index.html" class="btn"><i class="ti ti-layout-dashboard"></i> Back to dashboard</a>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
// jobId comes from URL — no sessionStorage
const jobId = new URLSearchParams(window.location.search).get('jobId');

async function retryFailed() {
  const btn = document.getElementById('retry-btn');
  const restore = window._app.btnLoad(btn, 'Resetting…');
  try {
    const res = await fetch(`${window._app.API_BASE}/api/contacts/retry-failed`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) { window._app.toast(data.error || 'Reset failed', 'error'); restore(); return; }
    if (data.retried === 0) { window._app.toast('No failed emails to retry.', 'info'); restore(); return; }
    window._app.toast(`${data.retried} contact${data.retried !== 1 ? 's' : ''} reset to queued.`, 'success');
    btn.style.display = 'none';
  } catch (err) {
    window._app.toast(err.message, 'error');
    restore();
  }
}

async function start() {
  window._app.initTheme();
  window._app.initMobileNav();

  // Load job from DB and stats in parallel
  const jobUrl = jobId
    ? `${window._app.API_BASE}/api/jobs/${jobId}`
    : `${window._app.API_BASE}/api/jobs/latest`;

  let batchSent = 0, batchFailed = 0, totalEverSent = 0, pendingApproval = 0;

  try {
    const [jobRes, statsRes] = await Promise.all([
      fetch(jobUrl),
      fetch(`${window._app.API_BASE}/api/contacts/stats`),
    ]);

    if (jobRes.ok) {
      const job = await jobRes.json();
      batchSent   = job.items.filter(i => i.status === 'sent').length;
      batchFailed = job.items.filter(i => i.status === 'failed').length;
    }
    if (statsRes.ok) {
      const s = await statsRes.json();
      totalEverSent  = s.sent   || 0;
      pendingApproval = s.pending || 0;
    }
  } catch (_) {}

  const subParts = [`${batchSent} email${batchSent !== 1 ? 's' : ''} delivered.`];
  if (batchFailed > 0) subParts.push(`${batchFailed} failed to send.`);
  if (pendingApproval > 0) subParts.push(`${pendingApproval} contact${pendingApproval > 1 ? 's are' : ' is'} still pending approval.`);

  document.getElementById('success-title').textContent = batchFailed > 0
    ? `${batchSent} sent, ${batchFailed} failed`
    : `${batchSent} email${batchSent !== 1 ? 's' : ''} sent!`;
  document.getElementById('success-sub').textContent = subParts.join(' ');

  document.getElementById('result-stats').innerHTML = `
    <div class="stat-card"><div class="stat-label">Sent this batch</div><div class="stat-value green">${batchSent}</div></div>
    ${batchFailed > 0 ? `<div class="stat-card"><div class="stat-label">Failed</div><div class="stat-value" style="color:var(--red)">${batchFailed}</div></div>` : ''}
    ${pendingApproval > 0 ? `<div class="stat-card"><div class="stat-label">Pending approval</div><div class="stat-value amber">${pendingApproval}</div>` : ''}
    <div class="stat-card"><div class="stat-label">Total ever sent</div><div class="stat-value">${totalEverSent}</div></div>
  `;

  if (batchFailed > 0) {
    const btn = document.getElementById('retry-btn');
    btn.style.display = '';
    btn.innerHTML = `<i class="ti ti-refresh"></i> Retry ${batchFailed} failed email${batchFailed !== 1 ? 's' : ''}`;
  }
  if (pendingApproval > 0) {
    document.getElementById('review-pending-btn').style.display = 'inline-flex';
  }
}

start();
</script>
</body>
</html>
