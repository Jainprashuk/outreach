name: Auto check mailbox

on:
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab
  schedule:
    - cron: '*/5 * * * *'   # every 5 min for testing (change to */30 for production)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mailbox check
        run: |
          curl -s -f -X POST ${{ secrets.VERCEL_APP_URL }}/api/check-mailbox \
            || echo "Check returned non-2xx (non-critical, will retry next run)"
