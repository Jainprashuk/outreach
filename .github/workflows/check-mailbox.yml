name: Auto check mailbox

on:
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab
  schedule:
    - cron: '*/5 * * * *'   # every 5 min for testing (change to */30 for production)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mailbox check
        run: |
          # /api/check-mailbox sits behind requireAuth, so this needs a credential.
          # Without one it returned 401 and the old `|| echo "non-critical"` hid it,
          # which meant this cron did nothing at all whenever AUTH_PASSWORD was set.
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.VERCEL_APP_URL }}/api/check-mailbox")
          echo "HTTP $code"
          cat /tmp/out.json; echo
          test "$code" = "200"
