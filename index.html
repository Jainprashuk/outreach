<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outreach — Dashboard</title>
<script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('outreach-theme')||'light');}catch(e){}})();</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon"><i class="ti ti-send"></i></div>
      <span class="sidebar-logo-text">Outreach</span>
    </div>
    <a href="index.html" class="nav-item active"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
    <a href="contacts.html" class="nav-item"><i class="ti ti-users"></i> Contacts</a>
    <a href="templates.html" class="nav-item"><i class="ti ti-file-text"></i> Templates</a>
    <div class="nav-section-label">Account</div>
    <a href="settings.html" class="nav-item"><i class="ti ti-settings"></i> Settings</a>
    <div class="sidebar-bottom">
      <div style="font-size:12px;color:var(--text2)">Gmail connected</div>
      <div style="font-size:11px;color:var(--text3);margin-top:2px" id="sb-email">Not set</div>
      <button class="theme-toggle" data-theme-toggle type="button">
        <span class="tt-icon"><i class="ti ti-sun"></i><i class="ti ti-moon"></i>Appearance</span>
        <i class="ti ti-chevron-right" style="font-size:12px"></i>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" data-mobile-menu-toggle type="button" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div>
          <h1>Dashboard</h1>
          <p id="last-run">Loading...</p>
        </div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-primary" id="resume-btn" style="display:none" onclick="resumeSending()"><i class="ti ti-player-play"></i> <span id="resume-btn-label">Resume sending</span></button>
        <button class="btn" id="retry-failed-btn" style="display:none" onclick="retryFailed()"><i class="ti ti-refresh"></i> <span id="retry-failed-label">Retry failed</span></button>
        <button class="btn" id="check-mailbox-btn" onclick="checkMailbox()"><i class="ti ti-mail-search"></i> <span id="check-mailbox-label">Check for bounces & replies</span></button>
        <a href="step1.html" class="btn btn-primary"><i class="ti ti-plus"></i> New entry</a>
      </div>
    </div>

    <!-- STATS -->
    <div class="stat-grid" id="stats-grid"></div>

    <!-- TABLE SECTION -->
    <div class="section" style="flex:1">
      <div class="section-head">
        <div class="nav-tabs" id="tabs">
          <div class="nav-tab active" data-tab="all">All</div>
          <div class="nav-tab" data-tab="sent">Sent</div>
          <div class="nav-tab" data-tab="pending">Pending approval</div>
          <div class="nav-tab" data-tab="remaining">Remaining</div>
          <div class="nav-tab" data-tab="bounced">Bounced</div>
          <div class="nav-tab" data-tab="replied">Replied</div>
        </div>
        <span class="contact-count-badge" id="count-badge">—</span>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
        <input type="text" id="search" placeholder="Search name, email or company..." style="flex:1;min-width:200px;max-width:320px">
        <select id="filter-status" style="width:auto;min-width:140px">
          <option value="">All statuses</option>
          <option value="queued">Queued</option>
          <option value="sent">Sent</option>
          <option value="failed">Failed</option>
          <option value="bounced">Bounced</option>
          <option value="replied">Replied</option>
        </select>
        <select id="filter-approval" style="width:auto;min-width:140px">
          <option value="">All approvals</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
        <select id="filter-template" style="width:auto;min-width:140px">
          <option value="">All templates</option>
        </select>
        <button class="btn btn-sm" id="clear-filters-btn" type="button">Clear filters</button>
      </div>
      <div class="table-card">
        <table id="contacts-table">
          <thead>
            <tr id="contacts-thead-row">
              <th>Contact</th>
              <th>Company</th>
              <th>Template</th>
              <th>Status</th>
              <th>Approval</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="contacts-tbody"></tbody>
        </table>
      </div>
      <div class="pagination-bar" id="pagination-bar" style="display:none">
        <button class="btn btn-sm" id="page-prev" onclick="changePage(-1)"><i class="ti ti-chevron-left"></i> Prev</button>
        <span class="page-info" id="page-info"></span>
        <button class="btn btn-sm" id="page-next" onclick="changePage(1)">Next <i class="ti ti-chevron-right"></i></button>
      </div>
    </div>
  </div>

</div>

<!-- REPLY MODAL -->
<div id="reply-modal-wrap" class="edit-modal-wrap" onclick="if(event.target===this)closeReplyModal()">
  <div class="edit-modal" style="max-width:540px">
    <div class="reply-modal-header">
      <div id="rm-chip" class="contact-chip"></div>
      <button class="btn btn-sm" onclick="closeReplyModal()" style="flex-shrink:0"><i class="ti ti-x"></i></button>
    </div>
    <div id="rm-meta" class="reply-meta"></div>
    <div id="rm-bubble" class="reply-bubble"></div>
    <div class="reply-modal-footer">
      <button class="btn btn-sm" onclick="closeReplyModal()"><i class="ti ti-x"></i> Close</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
const { getStats, filterContacts, avatarEl, statusBadge, state } = window._app;

let replySort = 'desc';
let currentReplyContactId = null;
let currentPage = 1;
const PAGE_SIZE = 25;

function resumeSending() {
  const resumable = state.contacts.filter(c => c.status === 'queued' && c.approvalStatus === 'approved');
  if (resumable.length === 0) return;
  sessionStorage.setItem('approved', JSON.stringify(resumable));
  window.location.href = 'step3.html';
}

async function retryFailed() {
  const btn = document.getElementById('retry-failed-btn');
  const restore = window._app.btnLoad(btn, 'Resetting…');
  try {
    const res = await fetch(`${window._app.API_BASE}/api/contacts/retry-failed`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Reset failed');
    if (data.retried === 0) { window._app.toast('No failed emails to retry.', 'info'); restore(); return; }
    window._app.toast(`${data.retried} contact${data.retried !== 1 ? 's' : ''} reset to queued.`, 'success');
    await window._app.loadContacts();
    renderAll();
  } catch (err) {
    window._app.toast(err.message, 'error');
    restore();
  }
}

function updateLastCheckedDisplay() {
  const d = state.sender.lastMailboxCheckAt;
  const el = document.getElementById('last-run');
  if (!d) { el.textContent = 'Mailbox not checked yet'; return; }
  const mins = Math.round((Date.now() - d) / 60000);
  el.textContent = mins < 1 ? 'Last checked: just now'
    : mins < 60 ? `Last checked: ${mins}m ago`
    : `Last checked: ${Math.round(mins / 60)}h ago`;
}

let silentChecking = false;

async function silentCheckMailbox() {
  if (silentChecking) return;
  silentChecking = true;
  try {
    const result = await window._app.checkMailbox();
    state.sender.lastMailboxCheckAt = result.lastCheckedAt ? new Date(result.lastCheckedAt) : new Date();
    updateLastCheckedDisplay();
    const parts = [];
    if (result.bounced?.length) parts.push(`${result.bounced.length} bounce${result.bounced.length !== 1 ? 's' : ''}`);
    if (result.replied?.length) parts.push(`${result.replied.length} repl${result.replied.length !== 1 ? 'ies' : 'y'}`);
    if (parts.length) {
      window._app.toast(`Found ${parts.join(' and ')}`, result.bounced?.length ? 'error' : 'success');
      render(activeTab());
    }
  } catch (_) { /* silent — don't surface auto-check errors to the user */ }
  finally { silentChecking = false; }
}

async function checkMailbox() {
  const btn = document.getElementById('check-mailbox-btn');
  const label = document.getElementById('check-mailbox-label');
  const original = label.textContent;
  btn.disabled = true;
  label.textContent = 'Checking...';

  try {
    const result = await window._app.checkMailbox();
    state.sender.lastMailboxCheckAt = result.lastCheckedAt ? new Date(result.lastCheckedAt) : new Date();
    updateLastCheckedDisplay();
    const parts = [];
    if (result.bounced?.length) parts.push(`${result.bounced.length} bounce${result.bounced.length !== 1 ? 's' : ''}: ${result.bounced.map(b => b.name).join(', ')}`);
    if (result.replied?.length) parts.push(`${result.replied.length} repl${result.replied.length !== 1 ? 'ies' : 'y'}: ${result.replied.map(r => r.name).join(', ')}`);

    if (parts.length === 0) {
      window._app.toast(`Scanned ${result.scanned} message${result.scanned !== 1 ? 's' : ''} — nothing new.`, 'info');
    } else {
      window._app.toast(`Found ${parts.join(' and ')}`, result.bounced?.length ? 'error' : 'success');
    }
    render(activeTab());
  } catch (err) {
    window._app.toast(err.message, 'error');
  } finally {
    btn.disabled = false;
    label.textContent = original;
  }
}

function toggleSort() {
  replySort = replySort === 'desc' ? 'asc' : 'desc';
  render(activeTab());
}

function render(tab) {
  const stats = getStats();

  const resumable = state.contacts.filter(c => c.status === 'queued' && c.approvalStatus === 'approved');
  const resumeBtn = document.getElementById('resume-btn');
  if (resumable.length > 0) {
    resumeBtn.style.display = '';
    document.getElementById('resume-btn-label').textContent = `Resume sending (${resumable.length})`;
  } else {
    resumeBtn.style.display = 'none';
  }

  const failedCount = state.contacts.filter(c => c.status === 'failed').length;
  const retryBtn = document.getElementById('retry-failed-btn');
  if (failedCount > 0) {
    retryBtn.style.display = '';
    document.getElementById('retry-failed-label').textContent = `Retry failed (${failedCount})`;
  } else {
    retryBtn.style.display = 'none';
  }
  const sentPct = stats.total ? Math.round(stats.sent / stats.total * 100) : 0;
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total contacts</div><div class="stat-value">${stats.total}</div></div>
    <div class="stat-card"><div class="stat-label">Sent</div><div class="stat-value green">${stats.sent}</div><div class="stat-sub">${sentPct}% of total</div></div>
    <div class="stat-card"><div class="stat-label">Bounced</div><div class="stat-value red">${stats.bounced}</div></div>
    <div class="stat-card"><div class="stat-label">Replied</div><div class="stat-value teal">${stats.replied}</div></div>
    <div class="stat-card"><div class="stat-label">Pending approval</div><div class="stat-value amber">${stats.pending}</div></div>
    <div class="stat-card"><div class="stat-label">Remaining</div><div class="stat-value">${stats.remaining}</div></div>
  `;

  // Unread count badge on the Replied tab
  const unreadCount = state.contacts.filter(c => c.status === 'replied' && !c.replyRead).length;
  const repliedTabEl = document.querySelector('.nav-tab[data-tab="replied"]');
  if (repliedTabEl) {
    repliedTabEl.innerHTML = unreadCount > 0
      ? `Replied <span class="tab-badge">${unreadCount}</span>`
      : 'Replied';
  }

  const tplNames = { 'intro-v2': 'Intro v2', 'follow-up': 'Follow-up', 'cold': 'Cold outreach' };
  let contacts = filterContacts(tab);

  const q = document.getElementById('search').value.trim().toLowerCase();
  if (q) contacts = contacts.filter(c => (c.name + c.email + c.company).toLowerCase().includes(q));

  const statusFilter = document.getElementById('filter-status').value;
  if (statusFilter) contacts = contacts.filter(c => c.status === statusFilter);

  const approvalFilter = document.getElementById('filter-approval').value;
  if (approvalFilter) contacts = contacts.filter(c => c.approvalStatus === approvalFilter);

  const templateFilter = document.getElementById('filter-template').value;
  if (templateFilter) contacts = contacts.filter(c => c.template === templateFilter);

  document.getElementById('count-badge').textContent = contacts.length + ' contacts';

  // ── Pagination ──────────────────────────────────────────────────────────
  const totalPages = Math.ceil(contacts.length / PAGE_SIZE) || 1;
  if (currentPage > totalPages) currentPage = totalPages;
  const pagedContacts = contacts.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  const paginationBar = document.getElementById('pagination-bar');
  if (totalPages > 1) {
    paginationBar.style.display = '';
    document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
    document.getElementById('page-prev').disabled = currentPage === 1;
    document.getElementById('page-next').disabled = currentPage === totalPages;
  } else {
    paginationBar.style.display = 'none';
  }

  if (tab === 'replied') {
    // Sort by repliedAt
    contacts = [...contacts].sort((a, b) => {
      const da = new Date(a.repliedAt || 0), db = new Date(b.repliedAt || 0);
      return replySort === 'desc' ? db - da : da - db;
    });
    const pagedReplied = contacts.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

    const sortIcon = replySort === 'desc' ? 'ti-arrow-down' : 'ti-arrow-up';
    document.getElementById('contacts-thead-row').innerHTML = `
      <th>Contact</th>
      <th>Company</th>
      <th>Reply preview</th>
      <th class="sortable" onclick="toggleSort()" title="Toggle sort order">
        Replied <i class="ti ${sortIcon}" style="font-size:10px;color:var(--text3)"></i>
      </th>
      <th>Status</th>
      <th></th>
    `;

    document.getElementById('contacts-tbody').innerHTML = pagedReplied.map(c => {
      const isNew = !c.replyRead;
      const fmtDate = c.repliedAt
        ? new Date(c.repliedAt).toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' })
        : '—';
      const raw = c.replySnippet || '';
      const snippet = raw.length > 75 ? raw.slice(0, 75) + '…' : raw;
      const unreadSpacer = isNew
        ? '<span class="reply-unread-dot"></span>'
        : '<span style="width:10px;display:inline-block;flex-shrink:0"></span>';
      return `
        <tr class="${isNew ? 'reply-unread-row' : ''}">
          <td>
            <div class="contact-chip">
              ${unreadSpacer}
              ${avatarEl(c.name)}
              <div>
                <div class="name">${c.name}</div>
                <div class="email">${c.email}</div>
              </div>
            </div>
          </td>
          <td style="color:var(--text2)">${c.company || '—'}</td>
          <td class="reply-snippet-cell">${snippet || '<span style="color:var(--text3)">No preview</span>'}</td>
          <td style="font-size:12px;white-space:nowrap;color:var(--text2)">${fmtDate}</td>
          <td>${isNew ? '<span class="badge badge-new">New</span>' : '<span class="badge badge-seen">Seen</span>'}</td>
          <td style="display:flex;gap:4px;align-items:center">
            <button class="btn btn-sm" onclick="openReplyModal('${c.id}')"><i class="ti ti-message"></i> View</button>
            <button class="btn btn-sm" onclick="confirmDelete('${c.id}')" title="Delete contact"><i class="ti ti-trash"></i></button>
          </td>
        </tr>
      `;
    }).join('') || `<tr><td colspan="6"><div class="empty-state"><i class="ti ti-message-off"></i>No replies yet</div></td></tr>`;

  } else {
    document.getElementById('contacts-thead-row').innerHTML = `
      <th>Contact</th><th>Company</th><th>Template</th><th>Status</th><th>Approval</th><th></th>
    `;

    document.getElementById('contacts-tbody').innerHTML = pagedContacts.map(c => {
      let actionBtn;
      if (c.status === 'failed') {
        actionBtn = `<button class="btn btn-sm btn-primary" onclick="retriggerContact('${c.id}')"><i class="ti ti-send"></i> Re-send</button>`;
      } else if (c.approvalStatus === 'pending') {
        actionBtn = `<a href="step2.html" class="btn btn-sm">Review</a>`;
      } else {
        actionBtn = `<button class="btn btn-sm" onclick="showDetail('${c.id}')">View</button>`;
      }
      return `
      <tr>
        <td>
          <div class="contact-chip">
            ${avatarEl(c.name)}
            <div>
              <div class="name">${c.name}</div>
              <div class="email">${c.email}</div>
            </div>
          </div>
        </td>
        <td style="color:var(--text2)">${c.company}</td>
        <td style="color:var(--text2)">${tplNames[c.template]||c.template}</td>
        <td>${statusBadge(c.status)}</td>
        <td>${statusBadge(c.approvalStatus)}</td>
        <td style="display:flex;gap:4px;align-items:center">
          ${actionBtn}
          <button class="btn btn-sm" onclick="confirmDelete('${c.id}')" title="Delete contact"><i class="ti ti-trash"></i></button>
        </td>
      </tr>`;
    }).join('') || `<tr><td colspan="6"><div class="empty-state"><i class="ti ti-inbox"></i>No contacts here yet</div></td></tr>`;
  }
}

function changePage(delta) {
  currentPage += delta;
  render(activeTab());
}

function retriggerContact(id) {
  const c = state.contacts.find(x => x.id === id);
  if (!c) return;
  const asApproved = [{ ...c, approvalStatus: 'approved', editedSubject: c.sentSubject || null }];
  sessionStorage.setItem('approved', JSON.stringify(asApproved));
  window.location.href = 'step3.html';
}

async function confirmDelete(id) {
  const c = state.contacts.find(x => x.id === id);
  if (!c) return;
  if (!confirm(`Delete ${c.name} (${c.email})?\nThis will hide the contact from all views.`)) return;
  try {
    await window._app.deleteContact(id);
    window._app.toast(`${c.name} deleted.`, 'success');
    render(activeTab());
  } catch (err) {
    window._app.toast(err.message, 'error');
  }
}

document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.nav-tab')?.dataset.tab;
  if (!tab) return;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  window._app.setTab(tab);
  currentPage = 1;
  render(tab);
});

function activeTab() {
  return document.querySelector('.nav-tab.active')?.dataset.tab || 'all';
}

function populateTemplateFilter() {
  const tplNames = { 'intro-v2': 'Intro v2', 'follow-up': 'Follow-up', 'cold': 'Cold outreach' };
  const select = document.getElementById('filter-template');
  Object.keys(state.templates).forEach(key => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = tplNames[key] || state.templates[key].name || key;
    select.appendChild(opt);
  });
}

['search'].forEach(id => document.getElementById(id).addEventListener('input', () => { currentPage = 1; render(activeTab()); }));
['filter-status', 'filter-approval', 'filter-template'].forEach(id => document.getElementById(id).addEventListener('change', () => { currentPage = 1; render(activeTab()); }));

document.getElementById('clear-filters-btn').addEventListener('click', () => {
  document.getElementById('search').value = '';
  document.getElementById('filter-status').value = '';
  document.getElementById('filter-approval').value = '';
  document.getElementById('filter-template').value = '';
  currentPage = 1;
  render(activeTab());
});

function showDetail(id) {
  const c = window._app.state.contacts.find(x => x.id === id);
  if (!c) return;
  if (c.status === 'replied') { openReplyModal(id); return; }
  let msg = `Contact: ${c.name}\nEmail: ${c.email}\nCompany: ${c.company}\nStatus: ${c.status}`;
  if (c.status === 'bounced' && c.bounceReason) msg += `\nBounce reason: ${c.bounceReason}`;
  alert(msg);
}

function openReplyModal(id) {
  const c = window._app.state.contacts.find(x => x.id === id);
  if (!c) return;
  currentReplyContactId = id;

  document.getElementById('rm-chip').innerHTML = `
    ${avatarEl(c.name)}
    <div>
      <div style="font-weight:600;font-size:15px">${c.name}</div>
      <div style="font-size:12px;color:var(--text2)">${c.email}${c.company ? ' · ' + c.company : ''}</div>
    </div>
  `;

  const repliedDate = c.repliedAt
    ? new Date(c.repliedAt).toLocaleString('en-US', { month:'long', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' })
    : 'Unknown date';
  const subjectLine = c.sentSubject
    ? `<span><i class="ti ti-mail"></i> Re: <em>${c.sentSubject.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</em></span>`
    : '';
  document.getElementById('rm-meta').innerHTML =
    subjectLine + `<span><i class="ti ti-calendar"></i> Replied on ${repliedDate}</span>`;

  const bubble = document.getElementById('rm-bubble');
  if (c.replySnippet) {
    bubble.textContent = c.replySnippet;
    bubble.classList.remove('empty');
  } else {
    bubble.textContent = 'No reply content was captured.';
    bubble.classList.add('empty');
  }

  document.getElementById('reply-modal-wrap').classList.add('open');

  // Auto-mark as read when opened
  if (!c.replyRead) {
    window._app.updateContact(id, { replyRead: true })
      .then(() => render(activeTab()))
      .catch(() => {});
  }
}

function closeReplyModal() {
  document.getElementById('reply-modal-wrap').classList.remove('open');
  currentReplyContactId = null;
}

// Close modal on Escape key
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeReplyModal();
});

async function start() {
  window._app.initTheme();
  window._app.initMobileNav();

  try {
    await window._app.init();
  } catch (err) {
    document.getElementById('contacts-tbody').innerHTML = `<tr><td colspan="6"><div class="empty-state"><i class="ti ti-alert-triangle"></i>${err.message}</div></td></tr>`;
  }

  updateLastCheckedDisplay();

  // Sidebar email
  if (state.sender.email) document.getElementById('sb-email').textContent = state.sender.email;

  populateTemplateFilter();
  render('all');

  // Auto-check on load if Gmail is configured and check is stale (>10 min or never run)
  const STALE_MS = 10 * 60 * 1000;
  const lastChecked = state.sender.lastMailboxCheckAt;
  if (state.sender.email && (!lastChecked || Date.now() - lastChecked > STALE_MS)) {
    setTimeout(silentCheckMailbox, 2000); // small delay so the page finishes rendering first
  }
}

// Periodic auto-check every 15 minutes while the tab is visible
setInterval(() => {
  if (document.visibilityState === 'visible' && state.sender.email) silentCheckMailbox();
}, 15 * 60 * 1000);

// Also check when user returns to a tab that's been idle
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !state.sender.email) return;
  const last = state.sender.lastMailboxCheckAt;
  if (!last || Date.now() - last > 10 * 60 * 1000) silentCheckMailbox();
});

// ── Skeleton screens — injected synchronously so the page never flashes blank ──
(function () {
  const sk = (w, h, extra) =>
    `<div class="skeleton" style="height:${h || '11px'};width:${w};${extra || ''}"></div>`;

  document.getElementById('stats-grid').innerHTML = Array(6).fill(0).map(() =>
    `<div class="stat-card">
      ${sk('55%', '10px', 'margin-bottom:10px')}
      ${sk('35%', '26px')}
    </div>`
  ).join('');

  const chip = `<div class="contact-chip">
    <div class="skeleton" style="width:32px;height:32px;border-radius:50%;flex-shrink:0"></div>
    <div>
      ${sk('90px', '11px', 'margin-bottom:5px')}
      ${sk('130px', '9px')}
    </div>
  </div>`;

  document.getElementById('contacts-tbody').innerHTML = Array(6).fill(0).map(() =>
    `<tr style="pointer-events:none">
      <td>${chip}</td>
      <td>${sk('75px')}</td>
      <td>${sk('65px')}</td>
      <td>${sk('48px', '20px', 'border-radius:20px')}</td>
      <td>${sk('58px', '20px', 'border-radius:20px')}</td>
      <td>${sk('48px', '28px', 'border-radius:6px')}</td>
    </tr>`
  ).join('');
})();

start();
</script>
</body>
</html>
