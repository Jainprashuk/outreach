<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outreach — Login</title>
<script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('outreach-theme')||'light');}catch(e){}})();</script>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body {
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    background:
      radial-gradient(60% 60% at 50% 0%, var(--accent-bg) 0%, transparent 70%),
      var(--bg2);
    padding:20px; 
  }
  .login-card {
    background:var(--bg);
    border:0.5px solid var(--border);
    border-radius:16px;
    padding:40px 36px;
    width:100%;
    max-width:380px;
    box-shadow:var(--shadow-lg);
    animation:loginIn .4s cubic-bezier(.4,0,.2,1) both;
  }
  @keyframes loginIn { from { opacity:0; transform:translateY(10px) scale(.98); } to { opacity:1; transform:none; } }
  .login-logo { display:flex; align-items:center; gap:10px; margin-bottom:28px; justify-content:center; }
  .login-logo-icon {
    width:38px; height:38px; border-radius:10px;
    background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:700;
    box-shadow:0 4px 14px rgba(79,70,229,.35);
  }
  .login-logo-text { font-size:18px; font-weight:600; color:var(--text); }
  .login-title { font-size:15px; font-weight:600; color:var(--text); margin-bottom:4px; text-align:center; }
  .login-sub { font-size:13px; color:var(--text2); margin-bottom:24px; text-align:center; }
  .login-label { font-size:12px; font-weight:500; color:var(--text2); margin-bottom:6px; display:block; }
  .login-input {
    width:100%; box-sizing:border-box;
    padding:10px 12px; border:1px solid var(--border-md);
    border-radius:8px; font-size:14px; font-family:inherit;
    background:var(--bg2); color:var(--text);
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .login-input:hover { border-color:var(--text3); }
  .login-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg); }
  .login-btn {
    width:100%; margin-top:18px;
    padding:11px; border:none; border-radius:8px;
    background:var(--accent); color:#fff;
    font-size:14px; font-weight:600; font-family:inherit;
    cursor:pointer; transition:background-color .15s, box-shadow .15s, transform .08s;
    box-shadow:0 2px 8px rgba(79,70,229,.25);
  }
  .login-btn:hover { background:var(--accent-hover); box-shadow:0 4px 14px rgba(79,70,229,.32); }
  .login-btn:active { transform:scale(.98); }
  .login-error {
    margin-top:14px; padding:10px 12px;
    background:#fff0f0; border:1px solid #fca5a5;
    border-radius:7px; font-size:13px; color:#b91c1c;
    text-align:center;
  }
  [data-theme="dark"] .login-error { background:#3f1010; border-color:#7f1d1d; color:#fca5a5; }
  .login-note {
    margin-top:14px; padding:10px 12px;
    background:var(--bg2); border:1px solid var(--border);
    border-radius:7px; font-size:13px; color:var(--text2);
    text-align:center;
  }
  /* One field rather than six boxes. autocomplete="one-time-code" is the
     load-bearing part — iOS and macOS fill it from the email automatically,
     which six separate inputs break. */
  .login-code {
    text-align:center; font-size:22px; font-weight:600;
    letter-spacing:10px; text-indent:10px;
    font-variant-numeric:tabular-nums;
  }
  .login-code::placeholder { letter-spacing:6px; text-indent:6px; font-weight:400; color:var(--text3); }
  .login-btn:disabled { opacity:.6; cursor:default; box-shadow:none; }
  .login-btn:disabled:hover { background:var(--accent); }
  .login-linkrow { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:16px; }
  .login-link {
    background:none; border:none; padding:0; font:inherit; font-size:13px;
    color:var(--accent); cursor:pointer;
  }
  .login-link:disabled { color:var(--text3); cursor:default; }
  .login-link:not(:disabled):hover { text-decoration:underline; }
  .login-dest { font-weight:500; color:var(--text); word-break:break-all; }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <div class="login-logo-icon">O</div>
    <span class="login-logo-text">Outreach</span>
  </div>

  <!-- Step 1: who are you -->
  <form id="email-form">
    <div class="login-title">Sign in</div>
    <div class="login-sub">We'll email you a code</div>
    <label class="login-label" for="email">Email</label>
    <input class="login-input" type="email" id="email" name="email" autofocus autocomplete="username" required>
    <button class="login-btn" id="email-btn" type="submit">Send code</button>
  </form>

  <!-- Step 2: prove it -->
  <form id="code-form" style="display:none">
    <div class="login-title">Enter your code</div>
    <div class="login-sub">Sent to <span class="login-dest" id="dest"></span></div>
    <label class="login-label" for="code">6-digit code</label>
    <input class="login-input login-code" type="text" id="code" name="code"
           inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="······"
           autocomplete="one-time-code" required>
    <button class="login-btn" id="code-btn" type="submit">Sign in</button>
    <div class="login-linkrow">
      <button class="login-link" id="back-btn" type="button">&larr; Use a different email</button>
      <button class="login-link" id="resend-btn" type="button">Resend code</button>
    </div>
  </form>

  <!-- Step 1b: not on the list -->
  <form id="request-form" style="display:none">
    <div class="login-title">Request access</div>
    <div class="login-sub"><span class="login-dest" id="req-dest"></span> isn't registered yet</div>
    <label class="login-label" for="req-name">Your name</label>
    <input class="login-input" id="req-name" autocomplete="name" style="margin-bottom:14px">
    <label class="login-label" for="req-note">Why you need access <span style="color:var(--text3)">(optional)</span></label>
    <textarea class="login-input" id="req-note" rows="3" maxlength="500"
              placeholder="Who you are and what you'd use it for." style="resize:vertical"></textarea>
    <button class="login-btn" id="req-btn" type="submit">Send request</button>
    <div class="login-linkrow">
      <button class="login-link" id="req-back" type="button">&larr; Use a different email</button>
    </div>
  </form>

  <div id="note" class="login-note" style="display:none"></div>
  <div id="err" class="login-error" style="display:none"></div>
</div>
<script>
  const emailForm = document.getElementById('email-form');
  const codeForm  = document.getElementById('code-form');
  const emailInput = document.getElementById('email');
  const codeInput  = document.getElementById('code');
  const emailBtn = document.getElementById('email-btn');
  const codeBtn  = document.getElementById('code-btn');
  const resendBtn = document.getElementById('resend-btn');
  const backBtn  = document.getElementById('back-btn');
  const note = document.getElementById('note');
  const err  = document.getElementById('err');
  const dest = document.getElementById('dest');

  const COOLDOWN_KEY = 'outreach-otp-cooldown-until';
  let cooldownTimer = null;

  const showErr = (msg) => { note.style.display = 'none'; err.textContent = msg; err.style.display = ''; };
  const showNote = (msg) => { err.style.display = 'none'; note.textContent = msg; note.style.display = ''; };
  const clearMsgs = () => { err.style.display = 'none'; note.style.display = 'none'; };

  // The server is the authority on the cooldown; this only stops a person
  // hammering a button that is silently doing nothing. Kept in sessionStorage so
  // a refresh does not appear to reset it.
  function startCooldown(ms) {
    const until = Date.now() + ms;
    try { sessionStorage.setItem(COOLDOWN_KEY, String(until)); } catch (e) {}
    tickCooldown();
  }

  function tickCooldown() {
    clearInterval(cooldownTimer);
    const render = () => {
      let until = 0;
      try { until = Number(sessionStorage.getItem(COOLDOWN_KEY)) || 0; } catch (e) {}
      const left = Math.ceil((until - Date.now()) / 1000);
      if (left > 0) {
        resendBtn.disabled = true;
        resendBtn.textContent = `Resend code (${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')})`;
      } else {
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend code';
        clearInterval(cooldownTimer);
      }
    };
    render();
    cooldownTimer = setInterval(render, 1000);
  }

  async function requestCode(address) {
    const res = await fetch('/api/auth/request-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: address }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error(data.error || 'Could not send a code');
      // Carried on the error so the caller can route to the request form
      // instead of matching on the message.
      err.canRequestAccess = data.canRequestAccess === true;
      err.requestPending = data.requestPending === true;
      throw err;
    }
    return data;
  }

  const requestForm = document.getElementById('request-form');
  const reqDest = document.getElementById('req-dest');
  const reqName = document.getElementById('req-name');
  const reqNote = document.getElementById('req-note');
  const reqBtn = document.getElementById('req-btn');
  const reqBack = document.getElementById('req-back');

  const showPane = (which) => {
    emailForm.style.display = which === 'email' ? '' : 'none';
    codeForm.style.display = which === 'code' ? '' : 'none';
    requestForm.style.display = which === 'request' ? '' : 'none';
  };

  emailForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsgs();
    // Disabled immediately: a cold start plus the mail provider can take a few
    // seconds, and a second click inside the cooldown does nothing at all.
    emailBtn.disabled = true;
    emailBtn.textContent = 'Sending…';
    const address = emailInput.value.trim();
    try {
      const data = await requestCode(address);
      dest.textContent = address;
      showPane('code');
      codeInput.focus();
      showNote('Check your email for a six-digit code.');
      startCooldown(data.cooldownMs || 60000);
    } catch (e2) {
      // Branch on the flag, not on the message text — the copy will change and
      // string matching would break silently when it does.
      if (e2.canRequestAccess) {
        reqDest.textContent = address;
        showPane('request');
        reqName.focus();
        showNote("You're not on the list yet. Ask below and the administrator will review it.");
      } else {
        showErr(e2.message);
      }
    } finally {
      emailBtn.disabled = false;
      emailBtn.textContent = 'Send code';
    }
  });

  requestForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsgs();
    reqBtn.disabled = true;
    reqBtn.textContent = 'Sending…';
    try {
      const res = await fetch('/api/auth/request-access', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: reqDest.textContent,
          name: reqName.value.trim(),
          note: reqNote.value.trim(),
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Could not send that request');
      showPane('email');
      showNote(data.message || 'Your request has been sent.');
      reqName.value = ''; reqNote.value = '';
    } catch (e2) {
      showErr(e2.message);
    } finally {
      reqBtn.disabled = false;
      reqBtn.textContent = 'Send request';
    }
  });

  reqBack.addEventListener('click', () => {
    clearMsgs();
    showPane('email');
    emailInput.focus();
  });

  resendBtn.addEventListener('click', async () => {
    if (resendBtn.disabled) return;
    clearMsgs();
    resendBtn.disabled = true;
    try {
      const data = await requestCode(dest.textContent);
      showNote('Another code is on its way.');
      startCooldown(data.cooldownMs || 60000);
    } catch (e2) {
      showErr(e2.message);
      resendBtn.disabled = false;
    }
  });

  backBtn.addEventListener('click', () => {
    clearMsgs();
    showPane('email');
    codeInput.value = '';
    emailInput.focus();
  });

  async function submitCode() {
    clearMsgs();
    codeBtn.disabled = true;
    codeBtn.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/auth/verify-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: dest.textContent, code: codeInput.value.trim() }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'That code is not valid');
      try { sessionStorage.removeItem(COOLDOWN_KEY); } catch (e) {}
      location.href = '/';
    } catch (e2) {
      showErr(e2.message);
      codeInput.value = '';
      codeInput.focus();
      codeBtn.disabled = false;
      codeBtn.textContent = 'Sign in';
    }
  }

  codeForm.addEventListener('submit', (e) => { e.preventDefault(); submitCode(); });

  // Submit as soon as six digits are in, whether typed, pasted or autofilled —
  // but keep the button for anyone navigating by keyboard.
  codeInput.addEventListener('input', () => {
    const digits = codeInput.value.replace(/\D/g, '').slice(0, 6);
    if (digits !== codeInput.value) codeInput.value = digits;
    if (digits.length === 6 && !codeBtn.disabled) submitCode();
  });

  tickCooldown();
</script>
</body>
</html>
